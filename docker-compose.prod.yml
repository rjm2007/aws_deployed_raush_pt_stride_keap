# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
# The dev docker-compose.yml stays for local work (mock provider, source mounts).
# The dashboard and Mock Stride are built from their own repos, cloned next to this one:
#   ~/aws_deployed_raush_pt_stride_keap  (this repo)
#   ~/rpt_frontend                       (github.com/rjm2007/rpt_frontend)
#   ~/mock_stride                        (git clone github.com/rjm2007/stride_mock mock_stride)
x-db: &needs-db
  db:
    condition: service_healthy

services:
  # The demo's own Postgres (moved off Supabase for HIPAA). No `ports:` on purpose: only
  # the containers here can reach it. Password comes from POSTGRES_PASSWORD in .env.
  # Tuned for a 4 GB box shared with about ten other containers.
  db:
    image: postgres:17.11
    container_name: stride-db
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 128mb
    # Let Postgres finish writing before a stop or reboot kills it.
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: rpt
      POSTGRES_DB: rpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      # Same ceiling as Supabase had; the per-container pools below stay as they were.
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpt -d rpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    # Concurrent calls' tool requests run in parallel threads; 3 connections let
    # three slow bookings starve every other request (DB allows 60).
    environment:
      DB_POOL_MAX_SIZE: "10"
    # Let an in-flight booking (up to ~15 s on Stride) finish before a deploy stops it.
    stop_grace_period: 30s
    volumes:
      - ./logs:/app/logs
    # Liveness only. /ready also reports 503 while Stride booking is switched
    # off for the practice, which is a deliberate state here; gating Caddy on
    # it took the whole site down.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Exactly one worker: the rate governors are process-local.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-worker
    restart: unless-stopped
    env_file: .env
    command: rpt-worker
    volumes:
      - ./logs:/app/logs

  # Separate from patient outreach: a slow Google/n8n request can never delay
  # a due call or SMS. It idles safely while SHEET_SYNC_ENABLED=false.
  sheet-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-sheet-worker
    restart: unless-stopped
    env_file: .env
    command: rpt-sheet-worker
    volumes:
      - ./logs:/app/logs
      # Google service account key for SHEET_SYNC_MODE=direct. Kept outside the repo (never
      # committed) and mounted read-only; unused in n8n mode.
      - /home/ubuntu/stride-secrets/google-sheet-sa.json:/run/secrets/google-sheet-sa.json:ro

  # Keap contact sync (phase 2B). Separate so a slow or rate-limited Keap can never
  # delay calls/SMS, the Sheet or the Stride import. Idles while KEAP_SYNC_ENABLED=false.
  keap-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-keap-worker
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    command: rpt-keap-worker
    # One pooled connection is plenty; the advisory lock holds a second while sync is on.
    environment:
      DB_POOL_MAX_SIZE: "1"
    volumes:
      - ./logs:/app/logs

  # Stride CSV import. The only container that sees the SFTP folders: it reads
  # Stride's uploads and moves each one to archive or error (so not read-only).
  # Keeps the voice-agent slot cache fresh from Stride (every BOOKING_SYNC_SECONDS).
  # Separate so a slow Stride never delays calls/SMS or the import. Idles when no
  # clinic, case type or clinician is set up.
  booking-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-booking-worker
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    command: rpt-booking-worker
    volumes:
      - ./logs:/app/logs

  # The host cron deletes archive/error files after 30 days.
  stride-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on: *needs-db
    container_name: stride-import-worker
    restart: unless-stopped
    # The importer streams files (flat memory), but if it ever misbehaves only
    # this container is killed, never the API or the call/SMS worker.
    mem_limit: 512m
    env_file: .env
    command: rpt-stride-worker
    environment:
      STRIDE_INBOX_DIR: /app/stride/incoming
      STRIDE_ARCHIVE_DIR: /app/stride/archive
      STRIDE_ERROR_DIR: /app/stride/error
    volumes:
      - ./logs:/app/logs
      - /srv/sftp/stride/incoming:/app/stride/incoming
      - /srv/stride/archive:/app/stride/archive
      - /srv/stride/error:/app/stride/error

  # Staff dashboard (was on Vercel). Talks to the api inside Docker, like production.
  # Secrets (token, users, session secret) live in dashboard.env next to .env, never in git.
  dashboard:
    build: ../rpt_frontend
    image: rpt-dashboard:latest
    container_name: stride-dashboard
    restart: unless-stopped
    mem_limit: 384m
    env_file: dashboard.env
    environment:
      DASHBOARD_API_ORIGIN: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  # Mock Stride test app (was on Vercel). Its own `mock_stride` schema lives in the same db.
  # It uploads CSVs over SFTP to this same server, reached as host.docker.internal.
  # Secrets live in mock-stride.env next to .env, never in git (that repo is public).
  # Served at https://demo.aibolt.ai/mock-stride (Caddy routes the path; Next needs the
  # prefix at build time).
  mock-stride:
    build:
      context: ../mock_stride
      args:
        BASE_PATH: /mock-stride
    image: mock-stride:latest
    container_name: stride-mock
    restart: unless-stopped
    mem_limit: 384m
    env_file: mock-stride.env
    environment:
      DATABASE_SSL: disable
      SFTP_HOST: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3100"
    depends_on: *needs-db

  caddy:
    image: caddy:2.11.4-alpine
    container_name: stride-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    # No depends_on for dashboard / mock-stride: if either fails to build or start, the API
    # host (Vapi and Twilio webhooks) must still come up.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
